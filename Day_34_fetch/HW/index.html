<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HW</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      h1 {
        text-align: center;
        margin: 20px 0;
      }
      body {
        background-color: lightgray;
      }
      section {
        padding: 20px;
        width: 100%;
        min-height: 70vh;
      }
      .products {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: left;
        margin: 5px;
        background-color: rgba(255, 255, 255, 0.353);
        width: 200px;
        height: 250px;
        padding: 10px;
        border-radius: 8px;
      }
      .card img {
        width: 100%;
        height: 60%;
        border-radius: 8px;
      }
      .name-price {
        font-weight: 700;
        width: 100%;
        gap: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .category {
        width: 100%;
        /* background-color: red; */
        display: flex;
        align-items: start;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to this product website</h1>
    <br />
    <section class="products"></section>

    <script src="script.js"></script>
  </body>
</html>
