<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: black;
        color: white;
      }
      .tb {
        background-color: gray;
        width: 100%;
        height: 40vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      table {
        border-radius: 10px;
        width: 50%;
        height: 70%;
        padding: 20px;
        border: 1px solid black;
        border-collapse: collapse;
      }
      thead {
        background-color: rgba(0, 0, 0, 0.712);
      }
      td {
        text-align: center;
        padding: 5px;
      }
      tbody {
        border-radius: 10px;
        background-color: rgba(51, 51, 55, 0.681);
      }
    </style>
  </head>
  <body>
    <!-- <h1>Day 34 to learn Javascript</h1> -->
    <br />
    <section class="tb">
      <table>
        <thead>
          <tr>
            <td><h2>Id</h2></td>
            <td><h2>Product</h2></td>
            <td><h2>Price</h2></td>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <script src="script.js"></script>
  </body>
</html>
